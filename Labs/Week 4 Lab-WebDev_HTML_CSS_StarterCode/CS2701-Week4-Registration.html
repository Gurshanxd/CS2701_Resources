<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Fresh Food For All
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header>
            <img src="images/logo.png" alt="Fresh Food For All Logo" class="logo">
        </header>

            <nav id = "navBarTop">
                <h2>Home</h2>
                <h2>Register</h2>
                <h2>Login</h2>
                <h2>Help</h2>
            </nav>
        </header>
        <nav>
            <!-- ToDo: An unordered list to represent the menu, 
                       each list item should correspond to the menu items (Home, Register, Login, Help)
                       The css class of the menu is "navlist"
                       Check lecture slides about lists, an example of a more basic menu, and CSS class selector-->
            <ul class="navlist">
            </ul>
         </nav>
        <main>
            <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
            <aside>
            </aside>
            <section>
                <form class="center" novalidate>
                <!-- ToDo: Implement the form containing 
                           Name - type text
                           email- type text
                           password - type text
                           Terms of Service - type checkbox
                           Register - button
                           Learn more - link
                           Check lecture slides and the links on the slides to learn about forms
                           and how to create a button that would react to a click Event
                        -->
                    <!-- Example given for user type checkboxes-->
                    <input type = "text" id = "userName" placeholder = "Enter your name: ">
                    <input type = "email" id = "userEmail" placeholder = "Enter your email: ">
                    <input type = "password" id = "userPassword" placeholder = "Enter your password: ">
                    <input type = "password" id = "userPassword2" placeholder = "Re-enter your password: ">
                    

                    <input type="checkbox" id="buyer" name="buyer" value="buyer">
                    <label for="buyer">I want to buy produce directly from allotment owners.</label><br>
                    <input type="checkbox" id="seller" name="seller" value="seller">
                    <label for="seller">I want to sell produce from my allotment.</label><br><br>

                    <br><br>

                    <input type = "checkbox" id = "agreement" name = "agree">
                    <label for = "agreement">I agree to the terms and <a href = "https://brightspace.brunel.ac.uk/d2l/le/lessons/75396/topics/2301476" target="_blank">conditions</a></label>
                    <input type = "button" id = "confirm" value = "Confirm">
                    <a href = "https://brightspace.brunel.ac.uk/d2l/le/lessons/75396/topics/2301476">Learn more</a>
                </form>
                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
